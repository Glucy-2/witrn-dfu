[project]
name = "witrn-dfu"
version = "0.2.0"
description = "Firmware updater for WITRN USB meters in bootloader (DFU) mode, for Linux, Windows and macOS"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
# Linux uses /dev/hidraw with the standard library; other platforms need hidapi
dependencies = ['hidapi>=0.14; sys_platform != "linux"']

[project.optional-dependencies]
hidapi = ["hidapi>=0.14"]

[project.scripts]
witrn-dfu = "witrn_dfu:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["witrn_dfu"]
