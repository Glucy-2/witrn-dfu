[project]
name = "witrn-dfu"
version = "0.1.0"
description = "Linux firmware updater for WITRN USB meters (bootloader/DFU mode over hidraw)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
witrn-dfu = "witrn_dfu:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["witrn_dfu"]
